<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Order Dashboard</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Angular 19 order management dashboard — 4M order dataset" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <style>
    .app-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #0f172a;
      color: #94a3b8;
      font-family: ui-sans-serif, system-ui, sans-serif;
      gap: 20px;
    }
    .app-loading__spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(148,163,184,0.15);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: app-spin 0.8s linear infinite;
    }
    .app-loading__title {
      font-size: 1rem;
      font-weight: 600;
      color: #e2e8f0;
      letter-spacing: 0.01em;
    }
    .app-loading__sub {
      font-size: 0.78rem;
      color: #64748b;
      margin-top: -12px;
    }
    @keyframes app-spin { to { transform: rotate(360deg); } }
  </style>
  <body>
    <app-root>
      <div class="app-loading">
        <div class="app-loading__spinner"></div>
        <p class="app-loading__title">Order Dashboard</p>
        <p class="app-loading__sub">Loading&hellip;</p>
      </div>
    </app-root>
  </body>
</html>
