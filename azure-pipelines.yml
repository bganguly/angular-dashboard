trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  NODE_VERSION: '20'
  REPO_NAME: 'angular-dashboard-frontend'

stages:
  - stage: CI
    displayName: 'Build & Test'
    jobs:
      - job: build_and_test
        displayName: 'npm ci → jest → ng build'
        steps:
          - task: NodeTool@0
            displayName: 'Use Node $(NODE_VERSION)'
            inputs:
              versionSpec: '$(NODE_VERSION).x'

          - script: npm ci
            displayName: 'Install dependencies'

          - script: npm test -- --ci --runInBand
            displayName: 'Run Jest tests'

          - task: PublishTestResults@2
            displayName: 'Publish test results'
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'coverage/junit.xml'
              failTaskOnFailedTests: true

          - script: npm run build:prod
            displayName: 'Production build'

          - task: PublishBuildArtifacts@1
            displayName: 'Publish dist artifact'
            inputs:
              pathToPublish: 'dist/angular-dashboard/browser'
              artifactName: 'angular-dashboard-dist'

  - stage: Deploy
    displayName: 'Deploy to Azure Static Web Apps'
    dependsOn: CI
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: deploy_static
        displayName: 'Deploy pre-built dist to Azure Static Web Apps'
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: angular-dashboard-dist

                - task: AzureStaticWebApp@0
                  displayName: 'Deploy to Azure Static Web Apps'
                  inputs:
                    azure_static_web_apps_api_token: '$(AZURE_STATIC_WEB_APPS_API_TOKEN)'
                    app_location: '$(Pipeline.Workspace)/angular-dashboard-dist'
                    skip_app_build: true
                    output_location: ''
